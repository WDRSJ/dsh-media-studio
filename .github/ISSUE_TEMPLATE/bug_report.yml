name: Bug report
description: Report a reproducible Media Studio problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, passwords, private paths, or personal media.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: DSH, Media Studio, ComfyUI, OS, Node.js
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Redact credentials and personal paths.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials, tokens and personal data from this report.
          required: true
